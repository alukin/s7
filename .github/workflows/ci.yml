name: S7 headless build and regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux headless
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: s7l2
    steps:
      - name: Bootstrap checkout tools
        working-directory: /
        run: dnf install -y git-core tar gzip ca-certificates
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install compiler and dependencies
        run: |
          bash tools/install_deps_fedora.sh --no-studio --no-extras
          c++ --version
          cmake --version
      - name: Configure headless build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DS7_BUILD_STUDIO=OFF -DS7_BUILD_GUI_REGRESSION_TESTS=OFF
      - name: Build application and tests
        run: cmake --build build --target build-tests --parallel 2
      - name: Headless regressions
        run: ctest --test-dir build --no-tests=error --output-on-failure --output-junit existing-results.xml -j 2
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            s7l2/build/Testing/Temporary/
            s7l2/build/*results.xml
